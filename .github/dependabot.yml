# Dependabot version updates — weekly PRs, minor/patch bumps grouped per
# ecosystem; major bumps stay individual so breaking changes get their own
# review. (Alerts + security updates are enabled in the repo Security
# settings; this file only controls the proactive PR cadence.)
version: 2
updates:
  # package.json dependencies + devDependencies (exact versions in
  # package-lock.json).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base images of the build (node) and runtime (nginx) stages.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]

  # Action pins in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]