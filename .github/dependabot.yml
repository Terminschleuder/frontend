version: 2
updates:
  # npm deps (package.json). Target develop so bumps land on the develop branch
  # (tested, no publish) and flow to main via a release PR — never publishing
  # per-bump.
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
    # Temporarily ignore these major bumps — typescript-eslint does not yet
    # support TypeScript 7 or eslint 10 (tracking: typescript-eslint#10940),
    # so TS 7 / eslint 10 / @eslint/js 10 break `tsc`/lint, and
    # eslint-plugin-react-hooks 7 changed its config shape alongside that.
    # @vitejs/plugin-react 6 is now USED (vite 8 below satisfies its peer) so
    # it is NOT ignored. Drop these entries once typescript-eslint supports
    # TS 7 / eslint 10.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]

  # Base image (Dockerfile).
  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # SHA-pinned GitHub Actions (ci.yml).
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5