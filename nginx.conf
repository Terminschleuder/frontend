# nginx config for the terminschleuder demo client (static SPA).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional same-origin API proxy (uncomment + set BACKEND_HOST to use).
    # With this on, the demo could use a relative "/api/" base URL and avoid
    # CORS entirely. Left off by default; we call the configured URL directly.
    #
    # location /api/ {
    #     proxy_pass $BACKEND_HOST;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # Don't cache the entrypoint (so deploys roll out immediately).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}