<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="terminschleuder">
  <defs>
    <linearGradient id="ts-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.55" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ts-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#ts-bg)"/>
  <!-- concentric arcs, lower-right, for a subtle geometric texture -->
  <g fill="none" stroke="url(#ts-accent)" stroke-opacity="0.25" stroke-width="6">
    <circle cx="1180" cy="360" r="120"/>
    <circle cx="1180" cy="360" r="210"/>
    <circle cx="1180" cy="360" r="300"/>
    <circle cx="1180" cy="360" r="390"/>
  </g>
  <!-- calendar glyph -->
  <g transform="translate(64,150)" fill="none" stroke="#e2e8f0" stroke-width="14">
    <rect x="0" y="20" width="120" height="100" rx="14"/>
    <line x1="0" y1="54" x2="120" y2="54"/>
    <line x1="28" y1="6" x2="28" y2="34"/>
    <line x1="92" y1="6" x2="92" y2="34"/>
  </g>
  <!-- wordmark -->
  <text x="210" y="225" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="64" font-weight="700" fill="#f1f5f9">terminschleuder</text>
  <text x="214" y="275" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="28" font-weight="500" fill="#94a3b8">events · nearby · now</text>
</svg>